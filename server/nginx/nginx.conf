# Benchmark target. Goal: be as cheap and predictable as possible so the client is what we measure.
worker_processes 2;          # match the number of CPUs in SERVER_CPUS (scripts/server.sh)
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;

    sendfile on;
    tcp_nodelay on;
    gzip off;
    etag off;

    # Never close keep-alive connections during a run (default is 1000 requests per connection).
    keepalive_timeout 300s;
    keepalive_requests 1000000000;

    open_file_cache max=16 inactive=600s;
    open_file_cache_valid 600s;

    default_type application/octet-stream;

    server {
        listen 8080 reuseport backlog=4096;
        root /usr/share/nginx/bench;

        location = /health {
            return 200 "ok";
        }

        # Static bodies generated by 10-payloads.sh: /bytes/0, /bytes/1k, /bytes/100k
        location /bytes/ {
        }

        # Reads the WHOLE request body, then answers {"ok":true} (11 bytes).
        # A plain `return` would answer before reading the body (nginx discards it lazily),
        # so the client would never wait for its upload. The proxy handler always reads the
        # body first; proxy_pass_request_body off keeps it from being forwarded upstream.
        location = /post {
            client_max_body_size 1m;
            client_body_buffer_size 1m;     # keep bodies in memory, never in temp files
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://ok_backend/ok;
        }
    }

    upstream ok_backend {
        server 127.0.0.1:8081;
        keepalive 64;
    }

    server {
        listen 127.0.0.1:8081;

        location = /ok {
            default_type application/json;
            return 200 '{"ok":true}';
        }
    }
}
