[versions]
jmh = "1.37"
jmh-plugin = "0.7.4"
httpclient5 = "5.6.5"
httpcore5 = "5.4.4"
okhttp = "5.5.1"
jetty = "12.1.14"
jetty-reactive = "4.1.5"
reactor-netty = "1.3.8"
spring = "7.0.10"
feign = "13.17"

[libraries]
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5" }
okhttp = { module = "com.squareup.okhttp3:okhttp-jvm", version.ref = "okhttp" }
jetty-client = { module = "org.eclipse.jetty:jetty-client", version.ref = "jetty" }
reactor-netty-http = { module = "io.projectreactor.netty:reactor-netty-http", version.ref = "reactor-netty" }

# Abstraction layers (clients-abstractions)
spring-web = { module = "org.springframework:spring-web", version.ref = "spring" }
spring-webflux = { module = "org.springframework:spring-webflux", version.ref = "spring" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring" }
httpcore5-reactive = { module = "org.apache.httpcomponents.core5:httpcore5-reactive", version.ref = "httpcore5" }
jetty-reactive-httpclient = { module = "org.eclipse.jetty:jetty-reactive-httpclient", version.ref = "jetty-reactive" }
feign-core = { module = "io.github.openfeign:feign-core", version.ref = "feign" }
feign-hc5 = { module = "io.github.openfeign:feign-hc5", version.ref = "feign" }
feign-okhttp = { module = "io.github.openfeign:feign-okhttp", version.ref = "feign" }
feign-java11 = { module = "io.github.openfeign:feign-java11", version.ref = "feign" }

[plugins]
jmh = { id = "me.champeau.jmh", version.ref = "jmh-plugin" }
